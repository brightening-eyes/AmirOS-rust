[workspace]
resolver = "2"
members = [
    "kernel",
    "hal",
    "mm",
    "drivers",
    "arch",
    "arch/x86_64",
    "arch/riscv64",
    "arch/aarch64",
    "arch/loongarch64",
]
# Bare `cargo build` / `cargo clippy` (used by husky hooks and CI) compile the
# kernel for the active target only, which pulls in exactly one per-arch crate
# via target-specific dependencies. Cross-target verification is done with an
# explicit `-p amir_kernel --target <triple>` per supported target.
default-members = ["kernel"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"

[profile.dev]
panic = "abort"

[profile.release]
debug = 0
opt-level = 3
codegen-units = 1
panic = "abort"
lto = "fat"
strip = "symbols"
overflow-checks = true
